<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my first javascript project </title>
</head>
<body>
    <button onclick="alert('hi my first js project ')"> click  me for a surprise</button>
    <script>
        // var variable = 'this is a variable';
        var username ='okon';
        console.log(username);
        // let variable = 'this is a variable';

        let name ='right';
        let age ='15';
        console.log(name);
        console.log(age);
        name="wrong";
        age="20";
        console.log(name);
        console.log(age);
        // const variable = 'this is a constant variable';
        const country='kenya';
        console.log(country);

        let  ismarried = false;
        let issingle = true;
        //boolean is a data type that can only have two values true or false
        console.log(ismarried);
        console.log(issingle);

        //login using boolean
        let isloggedin = true;
        if(isloggedin){
            console.log('user is logged in');
        }else{
         console.log("user is not logged in")   
        }
        //undefined is a data type that is used to represent a variable that has not been assigned a value
        let undefinedVariable;
        console.log(undefinedVariable);

        //null is a data type that is used to represent a variable that has been assigned a value of null
        let nullVariable = null;
        console.log(nullVariable);

        //OBJECTS
        let person = {
            name: 'okon',
            age: 15,
            ismarried: false
        };
        console.log(person);

        //array is a data type that is used to represent a collection of values
        let fruits = ['apple', 'banana', 'orange'];
        console.log(fruits[2]);
    </script>
</body>
</html>
