<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <img src="Screenshot 2026-09-29 110101.png" alt="Card Image">
            <h3>Card Title</h3>
            <p>Card description goes here.</p>
        </div>
        <div class="card">card 2</div>
        <div class="card">card 3</div>
    </div>
    <style>
        .card-wrapper{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .card{
            width: 300px;
            height: 400px;
            background-color: lightgray;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 20px;
        }
        .card img{
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        @media (max-width: 768px) {
            .card-wrapper{
                flex-direction: column;
                align-items: center;
                color: red;
            }
            .card{
                margin-bottom: 20px;
            }
        }
    </style>
</body>
</html>
