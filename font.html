<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> font and color</title>
</head>
<body>
    <div class="half">
    <h1 style="color: red; font-family: Arial, sans-serif;">HELLO WORLD</h1>
    <h2 style="color: #ffffff; font-family: 'Times New Roman', serif;">THIS IS MY SECOND PROJECT</h2>
</div>
<div class="half2">
    <h3 style="color: green; font-family: 'Courier New', monospace;">ABOUT TO DO MY THIRD PROJECT</h3>
    <p>my project on going</p>
</div>
    <style>
        div.half{
            background-color:blue;
            text-align: center;
            display: block;
            position: sticky;
            cursor: pointer;
        }
        div.half2{
            background-color: pink;
            position: sticky;
            cursor: pointer;
        }
        p{
            font-family: monospace;
            font-size: larger;
            font-style: italic;
            font-weight: bolder;
            color:oklab(72.37% -0.09787 0.02173);
            color:tomato;
        }
        h1{
            font-variant: small-caps;
        }

    </style>
</body>
</html>
