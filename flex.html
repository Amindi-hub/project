<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex </title>
</head>
<body>
    <div class="center-container">
        <div class="box">i am a box</div>
    </div>
    <style>
        .center-container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: blue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</body>
</html>
